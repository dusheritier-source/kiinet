name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_PUBLIC_SITE_URL: http://localhost:3000
  NEXT_PUBLIC_FIREBASE_API_KEY: ci-api-key
  NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: demo-kinet.firebaseapp.com
  NEXT_PUBLIC_FIREBASE_PROJECT_ID: demo-kinet
  NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: demo-kinet.appspot.com
  NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "123456789"
  NEXT_PUBLIC_FIREBASE_APP_ID: 1:123456789:web:ci
  KINET_SESSION_SECRET: ci-only-session-secret-with-at-least-32-bytes

jobs:
  web-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kinet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: kinet/package-lock.json
      - run: npm ci
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=critical
      - name: Security regression checks
        run: npm run test:security
      - name: Application smoke checks
        run: npm run test:smoke
      - name: Unit and API contract tests
        run: npm test
      - name: TypeScript
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: HTTP smoke test
        shell: bash
        run: |
          npm run start -- --hostname 127.0.0.1 > /tmp/kinet-next.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:3000/ >/dev/null && break
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:3000/ >/dev/null
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:3000/feed)" = "307"
      - uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: kinet/.next
          retention-days: 7

  firestore-rules:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kinet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: kinet/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run test:rules

  android-smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kinet/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: chmod +x gradlew
      - name: Android unit tests
        run: ./gradlew testDebugUnitTest --no-daemon
